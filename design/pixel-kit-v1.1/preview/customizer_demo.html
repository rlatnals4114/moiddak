<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>모이딱 캐릭터 에셋 미리보기</title><style>
*{box-sizing:border-box}body{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;background:#f9f7f2;color:#25253a;max-width:760px;margin:30px auto;padding:0 20px}h1{color:#3b55e8}#sprite{width:192px;height:256px;image-rendering:pixelated;display:block;margin:auto}section{background:white;border:1px solid #e0dcec;padding:24px;border-radius:22px;display:grid;grid-template-columns:230px 1fr;gap:20px}select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:5px}label{font-size:13px;font-weight:650}.opt{margin-bottom:10px}.preview{background:#ecebff;border-radius:15px;padding:18px}p{color:#686c80;font-size:14px}button{background:#3b55e8;color:white;border:0;padding:12px;border-radius:10px;cursor:pointer}@media(max-width:590px){section{grid-template-columns:1fr}}
</style></head><body><h1>모이딱. 캐릭터 에셋</h1><p>실제 투명 PNG 파츠를 겹쳐 표시하는 로컬 미리보기입니다. 서버 없이 파일을 열어 볼 수 있습니다.</p><section><div class="preview"><img id="sprite" src="../base/mint_8x.png"><button id="random" type="button">랜덤 캐릭터 만들기</button></div><div id="controls"></div></section><p>캐릭터 4종: base/ • 헤어 앞/뒤·표정·상의·하의·액세서리: parts/ • SVG: svg/</p><script>
const opts={hair:['spiky_mint','long_brown','bob_navy','fluffy_blonde','bun_brown','side_black','long_pink'],skin:['light','peach','warm','tan'],top:['blue','coral','mint','yellow','cream','navy'],bottom:['navy','denim','brown','lavender'],face:['default','happy','wink','sleepy'],accessory:['none','cap','headphones','glasses','bow','star']};
let selected={hair:'spiky_mint',skin:'light',top:'blue',bottom:'navy',face:'happy',accessory:'none'}; const order=['hair_back','bottom','skin','top','face','hair_front','accessory'];
const display={hair:'헤어스타일',skin:'피부톤',top:'상의',bottom:'하의',face:'표정',accessory:'액세서리'};
const controls=document.getElementById('controls');for(const k of Object.keys(opts)){const wrap=document.createElement('div');wrap.className='opt';const l=document.createElement('label');l.textContent=display[k];const s=document.createElement('select');s.id=k;opts[k].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)});s.value=selected[k];s.onchange=()=>{selected[k]=s.value;render()};wrap.append(l,s);controls.appendChild(wrap)}
const canvas=document.createElement('canvas');canvas.width=24;canvas.height=32;function render(){let ctx=canvas.getContext('2d');ctx.clearRect(0,0,24,32);const imgs=order.map(async key=>{let sub=key.startsWith('hair')?'hair':key;let path=`../parts/${key}/${selected[sub]}.png`;let im=new Image();im.src=path;try {await im.decode();return im}catch(e){return null}});Promise.all(imgs).then(arr=>{ctx.clearRect(0,0,24,32);arr.forEach(i=>{if(i)ctx.drawImage(i,0,0)});document.getElementById('sprite').src=canvas.toDataURL('image/png')})}
document.getElementById('random').onclick=()=>{for(let k of Object.keys(opts)){selected[k]=opts[k][Math.floor(Math.random()*opts[k].length)];document.getElementById(k).value=selected[k]}render()};render();
</script></body></html>
